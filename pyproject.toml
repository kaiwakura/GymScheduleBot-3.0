[project]
name = "gymschedulebot"
version = "3.0.0"
description = "A muscle-building planner that fits a recovery-aware training week around your calendar."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Form()/File() defaults are the documented pattern.
ignore = ["B008"]
